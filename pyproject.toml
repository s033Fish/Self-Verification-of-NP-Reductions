[project]
name = "reduction-agents"
version = "0.1.0"
description = "Self-verification of NP reductions by LLM agents."
requires-python = ">=3.12"
dependencies = [
    "modal==1.5.5",         # deploys the GLM endpoint, gateway and agent runner
    "pydantic==2.13.5",     # validates task descriptors
    "python-dotenv==1.2.3", # loads endpoint settings from .env
    "tqdm==4.67.3",         # progress while runs complete
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow", "benchmark"]
